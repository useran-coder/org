<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방화문 부자재부문 조직도</title>
  <style>
    :root {
      --ink: #20333a;
      --muted: #76858a;
      --line: #dbe5e5;
      --line-strong: #b6c9c9;
      --surface: #ffffff;
      --surface-soft: #f5f8f7;
      --canvas: #fbfcfb;
      --teal: #168a76;
      --teal-soft: #e6f4ef;
      --purple: #8668a9;
      --purple-soft: #f0ebf7;
      --blue: #4b78b9;
      --blue-soft: #eaf1fb;
      --orange: #d98248;
      --orange-soft: #fff0e6;
      --red: #e55c61;
      --red-soft: #fff0f0;
      --shadow: 0 18px 50px rgba(31, 65, 66, .08);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #ffffff;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: -.02em;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { height: 100vh; overflow: hidden; }
    .topbar {
      height: 82px;
      padding: 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { height: 46px; flex: 0 0 auto; display: flex; align-items: center; }

    .brand-copy { display: grid; gap: 2px; }
    .brand-copy strong { font-size: 18px; letter-spacing: -.045em; }
    .brand-copy span { color: var(--muted); font-size: 11px; }
    .topbar-right { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
    .top-actions { display: flex; gap: 8px; align-items: center; }

      color: var(--ink);
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 13px;
      transition: .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;

    .btn:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-1px); }
    .btn-primary { border-color: var(--teal); background: var(--teal); color: white; }

    .btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }

    .btn-small { padding: 6px 9px; font-size: 12px; }

    .workspace.inspector-open { grid-template-columns: minmax(0, 1fr) 322px; }
    .main-panel, .inspector { min-width: 0; background: var(--surface); border: 0; border-radius: 0; box-shadow: none; }
    .main-panel { padding: 14px 20px 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .heading-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }

    h1 { font-size: 27px; letter-spacing: -.055em; }
    .heading-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 5px var(--teal-soft); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-bottom: 17px; border-bottom: 0; }
    .toolbar-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    .search { min-width: 230px; height: 30px; position: relative; display: block; }
    .search input { width: 100%; height: 30px; box-sizing: border-box; padding: 0 10px 0 30px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); outline-color: var(--teal); font-size: 12px; line-height: 30px; }
    .search input::placeholder { font-size: 12px; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; line-height: 1; pointer-events: none; }
    .toolbar .btn { height: 30px; box-sizing: border-box; padding: 5px 10px; font-size: 12px; border-radius: 8px; }
    .people-stats, .monthly-panel { position: absolute; z-index: 24; top: 14px; left: 14px; right: 14px; max-height: calc(100% - 28px); overflow: auto; padding: 16px; border: 1px solid rgba(219, 229, 229, .72); border-radius: 16px; background: rgba(255, 255, 255, .5); box-shadow: 0 20px 60px rgba(31, 65, 66, .2); display: grid; gap: 12px; cursor: default; backdrop-filter: blur(14px); animation: layerIn .22s ease both; }
    .people-stats > *, .monthly-panel > * { opacity: 1; }
    .people-stats[hidden], .monthly-panel[hidden] { display: none; }
    @keyframes layerIn { from { opacity: 0; transform: translateY(-10px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    #toggleRankBtn[aria-expanded="true"], #toggleRankBtn[data-filter-active="true"] { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(22, 138, 118, .16); }
    #monthlyBtn[aria-expanded="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 700; }
    .stats-layer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stats-layer-head h2 { font-size: 16px; }
    .stats-summary { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .stats-column { min-width: 0; display: grid; grid-template-columns: 52px 1fr; align-items: start; gap: 9px; }
    .stats-column + .stats-column { padding-top: 10px; border-top: 1px solid var(--line); }
    .stats-column-title { padding-top: 6px; color: var(--ink); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .stat-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; padding: 3px; border: 1px dashed transparent; border-radius: 10px; transition: .16s ease; }
    .stat-chips.rank-drop-over { border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px rgba(75, 120, 185, .12); }
    .stat-chip { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); padding: 5px 9px; font-size: 11px; cursor: pointer; }
    .stat-chip:hover, .stat-chip.active { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
    .rank-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; cursor: grab; }
    .rank-chip.dragging { opacity: .42; }
    .rank-chip.drag-over { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .rank-chip.is-active { border-color: var(--teal); background: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
    .rank-chip.is-active .stat-chip, .rank-chip.is-active .rank-delete { color: white; }
    .rank-chip .stat-chip { border: 0; border-radius: 0; background: transparent; }
    .rank-delete { align-self: stretch; border: 0; border-left: 1px solid var(--line); background: transparent; color: #acb6b8; padding: 0 7px; font-size: 12px; line-height: 1; }
    .rank-delete:hover { background: #fff0f1; color: #c51d27; }
    .rank-add { border-style: dashed; color: var(--teal); }
    .stat-list { border-top: 1px solid var(--line); padding-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; max-height: 170px; overflow: auto; }
    .stat-list[hidden] { display: none; }
    .stat-person { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 8px 10px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
    .stat-person:hover { border-color: var(--teal); }
    .stat-person strong { color: var(--ink); font-size: 12px; }
    .stat-person span { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats-charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .chart-panel { min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .chart-panel h3 { margin-bottom: 11px; font-size: 13px; }
    .bar-chart { display: grid; gap: 7px; }
    .bar-row { width: 100%; display: grid; grid-template-columns: minmax(70px, 110px) minmax(80px, 1fr) 38px; align-items: center; gap: 8px; padding: 2px 0; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 11px; }
    .bar-row:hover .bar-fill, .bar-row.active .bar-fill { filter: saturate(1.3); box-shadow: 0 0 0 2px rgba(22, 138, 118, .18); }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 10px; overflow: hidden; border-radius: 999px; background: #edf2f1; }
    .bar-fill { display: block; height: 100%; min-width: 3px; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width .25s ease; }
    .bar-count { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .history-controls { display: grid; grid-template-columns: minmax(160px, 280px) 1fr; align-items: end; gap: 12px; }
    .monthly-chart { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; align-items: end; min-height: 190px; padding: 14px 10px 2px; }
    .month-bar { min-width: 0; height: 160px; display: grid; grid-template-rows: 20px 1fr 20px; gap: 5px; align-items: end; color: var(--muted); font-size: 10px; text-align: center; }
    .month-bar strong { color: var(--ink); font-size: 11px; }
    .month-bar span { width: min(42px, 72%); min-height: 4px; justify-self: center; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--blue), var(--teal)); }
    .canvas-wrap { position: relative; overflow: hidden; flex: 1; min-height: 0; margin: 12px -8px -4px; padding: 0; cursor: grab; border: 0; border-radius: 0; background: var(--canvas); touch-action: none; }
    .canvas-wrap.is-panning { cursor: grabbing; }
    .org-canvas { --readability: 1; width: 2800px; min-height: 1480px; padding: 28px 60px 70px; background: var(--canvas); transform-origin: 0 0; user-select: none; position: relative; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
    .top-tree { display: flex; flex-direction: column; align-items: center; padding-top: 6px; min-height: 420px; position: relative; width: 100%; z-index: 2; }
    .departments { position: relative; z-index: 2; }
    .owner-connection-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
    .connection-segment { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; pointer-events: none; }
    .connection-segment.is-selected { stroke: var(--blue); stroke-width: 4; }
    .connection-path { fill: none; stroke: transparent; stroke-width: 16; vector-effect: non-scaling-stroke; pointer-events: none; }
    .connection-handle { fill: var(--surface); stroke: var(--blue); stroke-width: 3; vector-effect: non-scaling-stroke; cursor: move; pointer-events: all; }
    .connection-handle.is-selected { fill: var(--orange-soft); stroke: var(--orange); }
    .connection-handle.is-endpoint { r: 9; }
    .connection-snap-indicator { fill: rgba(31, 111, 235, .15); stroke: var(--blue); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
    .org-canvas.line-editing .owner-connection-layer { z-index: 8; }
    .org-canvas.line-editing .connection-path { pointer-events: stroke; cursor: move; }
    .btn.line-edit-action:disabled { opacity: .42; cursor: not-allowed; transform: none; }
    .free-connection-layer { display: none; }
    .free-leader { position: absolute; z-index: 4; width: max-content; min-width: 260px; transform: translate(-50%, -50%); }
    .free-leader > .exec-card { position: relative; z-index: 3; width: 260px; min-width: 260px; }
    .leader-align-guide { position: absolute; z-index: 3; display: none; pointer-events: none; background: rgba(31, 111, 235, .62); box-shadow: 0 0 0 1px rgba(255, 255, 255, .8); }
    .leader-align-guide.is-active { display: block; }
    .leader-align-guide.vertical { top: 0; bottom: 0; width: 1px; transform: translateX(-.5px); }
    .leader-align-guide.horizontal { left: 0; right: 0; height: 1px; transform: translateY(-.5px); }
    .free-owner-group { position: absolute; top: calc(100% + 34px); left: 50%; transform: translate(calc(-50% + var(--group-x, 0px)), var(--group-y, 0px)); min-width: 240px; padding-top: 0; z-index: 2; }
    .free-owner-group::before { display: none; }
    .free-owner-head { display: none; }
    .free-owner-departments { display: grid; grid-template-columns: repeat(var(--free-cols, 1), minmax(220px, 1fr)); gap: 16px; align-items: start; border-top: 0; padding-top: 20px; }
    .org-canvas.free-leader-over { box-shadow: none; }
    .person-card { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 0; cursor: pointer; min-width: 0; }
    .person-card:hover .person-name { color: var(--teal); }
    .avatar { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); background: linear-gradient(145deg, #d9e9e5, #eef4f2); display: grid; place-items: center; color: #56716d; font-size: calc(13px * var(--readability)); font-weight: 700; }
    .avatar.small { width: 36px; height: 36px; font-size: calc(11px * var(--readability)); }

    .person-copy { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; }
    .person-heading { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .person-name { flex: 1 1 auto; min-width: 0; font-size: calc(13px * var(--readability)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-badge { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: calc(20px * var(--readability)); padding: 2px calc(6px * var(--readability)); border-radius: 3px; color: white; font-size: calc(10px * var(--readability)); font-weight: 800; line-height: 1; white-space: nowrap; }
    .badge-part { background: #df171e; }
    .badge-team { background: #2563b9; }

    .person-tenure { color: #7f9296; font-weight: 700; }
    .person-row.search-muted, .exec-card.search-muted { opacity: .18; filter: grayscale(.55); }
    .person-row.search-match, .exec-card.search-match { position: relative; z-index: 6; background: #fffbe8; box-shadow: 0 0 0 3px rgba(239, 174, 31, .32), 0 9px 24px rgba(75, 55, 9, .12); }

    .exec-card.business .person-role { color: var(--blue); }

    .leader-center { grid-column: 2; justify-self: center; z-index: 2; }

    .department.dept-child-over > .drop-hint { display: block; background: var(--orange); }
    .department.dept-dragging { opacity: .48; }
    .department-head { padding: 10px 11px 9px; display: flex; align-items: center; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--line); }
    .department-title { display: grid; align-items: start; gap: 2px; min-width: 0; border: 0; padding: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .department-title:hover strong { color: var(--teal); }
    .department-title strong { font-size: calc(13px * var(--readability)); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .department-title span { display: block; color: var(--muted); font-size: calc(11px * var(--readability)); line-height: 1.2; }
    .department-tools { display: flex; gap: 2px; }
    .icon-button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 17px; line-height: 1; }
    .icon-button:hover { background: var(--surface-soft); color: var(--teal); }
    .icon-button.to-tool { width: 34px; font-size: 10px; font-weight: 800; color: #cf1b25; }
    .department-body { min-height: 98px; padding: 8px 11px 11px; display: grid; gap: 7px; }
    .person-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 5px; border-radius: 10px; transition: .18s ease; }
    .person-row:hover { background: var(--surface-soft); }
    .person-row.dragging { opacity: .45; }
    .person-row.person-drag-over { background: var(--teal-soft); box-shadow: inset 0 2px 0 var(--teal); }
    .drag-grip { color: #b8c6c5; font-size: 14px; cursor: grab; padding: 4px 2px; }
    .to-row { width: 100%; min-height: 54px; border: 1px dashed #d7a8ab; border-radius: 10px; background: #fffafb; padding: 6px 8px; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; }
    .to-row:hover { border-color: #d61f2c; background: #fff3f4; }
    .to-row.selected { border-color: #d61f2c; background: #fff2f3; box-shadow: 0 0 0 3px rgba(214, 31, 44, .13); }
    .to-circle { width: 40px; height: 40px; flex: 0 0 40px; border: 2px dashed #d61f2c; border-radius: 50%; display: grid; place-items: center; color: #d61f2c; font-size: 13px; font-weight: 800; background: white; }
    .to-copy { display: grid; gap: 2px; }
    .to-copy strong { color: #d61f2c; font-size: 11px; }
    .to-copy span { color: var(--muted); font-size: 9px; }
    .empty-drop { min-height: 72px; border: 1px dashed var(--line-strong); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; padding: 12px; }
    .empty-drop span { display: block; }
    .department-branch { min-width: 220px; width: max-content; display: flex; flex-direction: column; align-items: center; position: relative; }
    .department-branch > .department { width: 220px; }
    .sub-departments { margin: 0; padding: 42px 0 0; display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: center; gap: 18px; width: max-content; border: 0; position: relative; }
    .sub-label { display: none; }
    .department.is-child { border-width: 1px; border-top-width: 3px; box-shadow: none; }
    .department.is-child .department-head { padding-top: 8px; }
    .department.is-child .department-body { min-height: 72px; }
    .inspector { position: relative; z-index: 12; padding: 23px 21px; height: 100%; overflow: auto; opacity: 0; transform: translateX(34px); box-shadow: -18px 0 44px rgba(31, 65, 66, .16); transition: opacity .26s ease, transform .3s cubic-bezier(.2,.75,.25,1), box-shadow .3s ease; }
    .inspector.is-visible { opacity: 1; transform: translateX(0); box-shadow: -18px 0 44px rgba(31, 65, 66, .2); }
    .inspector[hidden] { display: none; }
    .inspector-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 20px; }
    .inspector h2 { font-size: 18px; letter-spacing: -.04em; }
    .inspector-kicker { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .selected-profile { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 18px; background: var(--surface-soft); border-radius: 13px; }
    .department-profile { align-items: flex-start; }
    .department-swatch { width: 44px; height: 44px; border-radius: 13px; background: var(--teal-soft); border: 1px solid #b8dbd2; display: grid; place-items: center; color: var(--teal); font-size: 20px; font-weight: 800; }
    .selected-profile strong { display: block; font-size: 14px; }
    .selected-profile span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .field { display: grid; gap: 7px; margin-bottom: 13px; }
    .field label { color: #55676b; font-size: 11px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--surface); outline-color: var(--teal); font-size: 12px; }
    .field input, .field select { height: 30px; padding: 0 10px; }
    .field textarea { min-height: 70px; padding: 8px 10px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: rgba(118, 133, 138, .45); opacity: 1; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .photo-actions { display: flex; gap: 8px; align-items: center; }
    .helper { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .inspector-actions { display: flex; gap: 8px; margin-top: 18px; }
    .inspector-actions .btn { flex: 1; }
    .btn-danger { border-color: #efc4c7; color: #c51d27; }
    .btn-danger:hover { border-color: #c51d27; background: #fff1f2; color: #a9151e; }
    .empty-inspector { display: grid; place-items: center; text-align: center; gap: 11px; min-height: 300px; color: var(--muted); }
    .empty-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: var(--teal); background: var(--teal-soft); font-size: 21px; }
    .footer-note { display: flex; align-items: center; gap: 7px; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 10; color: white; background: #22383a; padding: 11px 14px; border-radius: 10px; font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .zoom-controls { height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 3px; padding: 0; border: 0; background: transparent; }
    .zoom-controls .btn { height: 30px; padding: 4px 8px; border: 1px solid var(--line); font-size: 12px; }
    .zoom-value { min-width: 42px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 12px; text-align: center; }
    .drop-hint { display: none; position: absolute; inset: auto 12px -13px; z-index: 2; text-align: center; background: var(--teal); color: white; border-radius: 7px; padding: 5px; font-size: 10px; }
    .department.drag-over .drop-hint { display: block; }
    .line-style-controls { height: 30px; display: flex; align-items: center; gap: 5px; }
    .line-style-controls[hidden] { display: none; }
    .line-style-controls select, .line-style-controls input { height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 11px; }
    .line-style-controls select { padding: 0 7px; }
    .line-style-controls input[type="color"] { width: 34px; padding: 3px; }
    .org-only-mode .topbar, .org-only-mode .toolbar, .org-only-mode .people-stats, .org-only-mode .monthly-panel, .org-only-mode .footer-note, .org-only-mode .inspector { display: none !important; }
    .org-only-mode .workspace { height: 100vh; padding: 0; display: block; }
    .org-only-mode .main-panel { height: 100vh; padding: 0; }
    .org-only-mode .canvas-wrap { height: 100vh; margin: 0; }
    .fullscreen-exit { display: none; position: absolute; z-index: 40; top: 14px; right: 14px; box-shadow: 0 8px 24px rgba(31, 65, 66, .18); }
    .org-only-mode .fullscreen-exit { display: inline-flex; }
    .print-preparing .workspace { grid-template-columns: minmax(0, 1fr); }
    .print-preparing .inspector, .print-preparing .toolbar, .print-preparing .footer-note { display: none !important; }
    @media (max-width: 760px) { .stats-charts { grid-template-columns: 1fr; } .history-controls { grid-template-columns: 1fr; } }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { overflow: hidden; background: #fff; }
      .topbar { display: flex !important; min-height: 0; padding: 0 0 10px; border: 0; box-shadow: none; }
      .topbar-right, .brand-copy span, .toolbar, .people-stats, .monthly-panel, .footer-note, .inspector, .fullscreen-exit { display: none !important; }
      .brand-mark { width: 142px; height: 33px; }
      .brand-copy strong { font-size: 19px; }
      .app-shell, .workspace, .main-panel { height: auto !important; min-height: 0 !important; overflow: hidden !important; padding: 0 !important; margin: 0 !important; }
      .workspace { display: block !important; }
      .canvas-wrap { width: 100% !important; height: 176mm !important; overflow: hidden !important; padding: 0 !important; margin: 0 !important; background: #fff; }
      .org-canvas { transform-origin: 0 0; }
    }
    @media (max-width: 1080px) {
      .workspace, .workspace.inspector-open { grid-template-columns: 1fr; }
      .inspector { position: fixed; right: 12px; bottom: 12px; width: 310px; height: auto; max-height: 72vh; z-index: 8; }
      .stats-charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .topbar { height: auto; padding: 16px; gap: 14px; align-items: flex-start; }
      .topbar-right { flex-wrap: wrap; justify-content: flex-end; }
      .top-actions { flex-wrap: wrap; justify-content: end; }
      .top-actions .btn { padding: 8px 9px; font-size: 11px; }
      .workspace { padding: 8px; gap: 8px; height: calc(100vh - 74px); }
      .main-panel { padding: 18px 15px 19px; }
      .heading-row { align-items: flex-start; flex-direction: column; gap: 10px; }
      h1 { font-size: 23px; }
      .search { min-width: 100%; }
      .stats-summary { grid-template-columns: 1fr; }
      .stats-charts { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <main class="workspace">
      <section class="main-panel" aria-label="조직도 보드">
        <div class="toolbar">
          <div class="toolbar-group">
            <button class="btn" id="undoBtn" type="button" disabled aria-label="되돌리기 Ctrl+Z">↶ 되돌리기</button>
            <button class="btn" id="redoBtn" type="button" disabled aria-label="다시 실행 Ctrl+Y">↷ 다시 실행</button>
            <label class="search"><span class="search-icon" aria-hidden="true">⌕</span><span class="sr-only">구성원 검색</span><input id="searchInput" type="search" placeholder="이름 또는 직함 검색"></label>
            <button class="btn" id="addPersonBtn" type="button">+ 구성원</button>
            <button class="btn" id="addLeaderBtn" type="button">+ 상위 구성원</button>
            <button class="btn" id="addBusinessBtn" type="button">+ 사업부</button>
            <button class="btn" id="addDeptBtn" type="button">+ 파트</button>
            <button class="btn" id="lineEditBtn" type="button" aria-pressed="false">연결선 편집</button>
            <button class="btn line-edit-action" id="deletePointBtn" type="button" hidden disabled>접점 삭제</button>
            <button class="btn line-edit-action" id="deleteSegmentBtn" type="button" hidden disabled>세그먼트 삭제</button>
            <div class="line-style-controls" id="lineStyleControls" hidden aria-label="선택한 세그먼트 스타일">
              <select id="lineWidthField" aria-label="선 두께"><option value="1">1px</option><option value="2" selected>2px</option><option value="3">3px</option><option value="4">4px</option><option value="6">6px</option></select>
              <input id="lineColorField" type="color" value="#20333a" aria-label="선 색상">
              <select id="lineDashField" aria-label="선 종류"><option value="solid">실선</option><option value="dashed">파선</option><option value="dotted">점선</option></select>
            </div>
            <button class="btn" id="saveJpgBtn" type="button">JPG 저장</button>
            <button class="btn" id="savePdfBtn" type="button">PDF 저장</button>
            <button class="btn" id="printBtn" type="button">인쇄</button>
            <button class="btn" id="toggleRankBtn" type="button" aria-expanded="false" aria-controls="peopleStats">직위/직책</button>
            <button class="btn" id="monthlyBtn" type="button" aria-expanded="false" aria-controls="monthlyPanel">월별 인원</button>
            <button class="btn" id="fullscreenBtn" type="button">전체화면</button>
            <div class="zoom-controls" aria-label="화면 확대 축소">
              <button class="btn" id="zoomOutBtn" type="button" aria-label="축소">−</button>
              <span class="zoom-value" id="zoomValue">100%</span>
              <button class="btn" id="zoomInBtn" type="button" aria-label="확대">＋</button>
              <button class="btn" id="fitBtn" type="button">화면 맞춤</button>
            </div>
          </div>
        </div>
        <div class="canvas-wrap">
          <section class="people-stats" id="peopleStats" aria-label="직위와 직책별 인원 현황" hidden>
            <div class="stats-layer-head"><h2>직위/직책 및 근속 현황</h2><button class="btn btn-small" id="closeStatsBtn" type="button">닫기</button></div>
            <div class="stats-summary" id="statsSummary"></div>
            <div class="stats-charts"><section class="chart-panel"><h3>직위 인원수</h3><div class="bar-chart" id="positionChart"></div></section><section class="chart-panel"><h3>직책 인원수</h3><div class="bar-chart" id="roleChart"></div></section><section class="chart-panel"><h3>직원 근속연수</h3><div class="bar-chart" id="tenureChart"></div></section></div>
            <div class="stat-list" id="statPersonList" hidden></div>
          </section>
          <section class="monthly-panel" id="monthlyPanel" aria-label="월별 인원 및 조직도 저장 이력" hidden>
            <div class="stats-layer-head"><h2>월별 인원 및 저장 히스토리</h2><button class="btn btn-small" id="closeMonthlyBtn" type="button">닫기</button></div>
            <div class="history-controls"><div class="field"><label for="historySelect">저장된 조직도</label><select id="historySelect"><option value="">현재 조직도</option></select></div><p class="helper">저장하기 버튼을 누를 때 조직도 이력이 생성됩니다. 월 말에 실행하면 해당 월 최종 인원이 자동 기록됩니다.</p></div>
            <section class="chart-panel"><h3>월별 최종 인원</h3><div class="monthly-chart" id="monthlyChart"></div></section>

          <button class="btn fullscreen-exit" id="exitFullscreenBtn" type="button">전체화면 종료</button>

      window.addEventListener("resize", () => requestAnimationFrame(() => { fitView(); drawConnections(); }));
      $("#searchInput").addEventListener("input", event => { searchTerm = event.target.value; render(); });
      const peopleStats = $("#peopleStats");
      peopleStats.addEventListener("dragstart", event => {
        const chip = event.target.closest("[data-rank-value]"); if (!chip) return;
        event.stopPropagation(); draggedRankValue = chip.dataset.rankValue; draggedRankGroup = chip.dataset.rankGroup; chip.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", draggedRankValue);
      });
      peopleStats.addEventListener("dragover", event => {
        const zone = event.target.closest("[data-rank-drop-group]"); if (!draggedRankValue || !zone) return;
        event.preventDefault(); event.stopPropagation(); zone.classList.add("rank-drop-over");
        const chip = event.target.closest("[data-rank-value]");
        if (chip && chip.dataset.rankValue !== draggedRankValue) chip.classList.add("drag-over");
      });
      peopleStats.addEventListener("dragleave", event => {
        const chip = event.target.closest("[data-rank-value]"); if (chip && !chip.contains(event.relatedTarget)) chip.classList.remove("drag-over");
        const zone = event.target.closest("[data-rank-drop-group]"); if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove("rank-drop-over");
      });
      peopleStats.addEventListener("drop", event => {
        const zone = event.target.closest("[data-rank-drop-group]"); if (!draggedRankValue || !draggedRankGroup || !zone) return;
        const chip = event.target.closest("[data-rank-value]");
        event.preventDefault(); event.stopPropagation(); reorderRank(draggedRankValue, draggedRankGroup, chip?.dataset.rankValue || null, zone.dataset.rankDropGroup); draggedRankValue = null; draggedRankGroup = null;
      });
      peopleStats.addEventListener("dragend", event => {
        event.stopPropagation(); draggedRankValue = null; draggedRankGroup = null; $$(".rank-chip.dragging, .rank-chip.drag-over").forEach(chip => chip.classList.remove("dragging", "drag-over")); $$(".stat-chips.rank-drop-over").forEach(zone => zone.classList.remove("rank-drop-over"));
      });
      $("#orgChartApp").addEventListener("click", event => {
        const addRankButton = event.target.closest("[data-add-rank-group]"); if (addRankButton) return addRank(addRankButton.dataset.addRankGroup);
        const deleteRankButton = event.target.closest("[data-delete-rank]"); if (deleteRankButton) return deleteRank(deleteRankButton.dataset.deleteRank, deleteRankButton.dataset.deleteRankGroup);
        const statChip = event.target.closest("[data-stat-type]");
        if (statChip) {
          const same = selectedStatType === statChip.dataset.statType && selectedStatValue === statChip.dataset.statValue;
          selectedStatType = same ? null : statChip.dataset.statType; selectedStatValue = same ? null : statChip.dataset.statValue; updateRankButtonState(); render(); return;
        }
        const statPerson = event.target.closest("[data-stat-person]"); if (statPerson) return selectPerson(statPerson.dataset.statPerson);
        const addOpening = event.target.closest("[data-add-opening]"); if (addOpening) return changeDepartmentOpenings(addOpening.dataset.addOpening, 1);
        const opening = event.target.closest("[data-opening-id]"); if (opening) return selectOpening(opening.dataset.openingDepartment, opening.dataset.openingId);
        const personNode = event.target.closest("[data-person-id]"); if (personNode) return selectPerson(personNode.dataset.personId);
        const departmentNode = event.target.closest("[data-department-select]"); if (departmentNode) return selectDepartment(departmentNode.dataset.departmentSelect);
        const childBtn = event.target.closest("[data-add-child]"); if (childBtn) return addDepartment(childBtn.dataset.addChild);
        const memberBtn = event.target.closest("[data-add-member-to]"); if (memberBtn) return addPerson(memberBtn.dataset.addMemberTo);
      });
      $("#orgChartApp").addEventListener("dragstart", event => {
        const row = event.target.closest(".person-row");
        const executive = event.target.closest("[data-executive-id]");
        const department = event.target.closest(".department");
        if (row) {
          draggedType = "person"; draggedPersonId = row.dataset.rowId; row.classList.add("dragging");
        } else if (executive) {
          draggedType = "leader"; draggedPersonId = executive.dataset.executiveId; $("#executiveTree").classList.add("drag-active");
        } else if (department) {
          draggedType = "department"; draggedDepartmentId = department.dataset.departmentId; department.classList.add("dept-dragging");
        } else return;
        event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", draggedPersonId || draggedDepartmentId);
      });
      $("#orgChartApp").addEventListener("dragend", event => {
        const row = event.target.closest(".person-row"); if (row) row.classList.remove("dragging");
        $("#executiveTree").classList.remove("drag-active");
        $("#orgCanvas").classList.remove("free-leader-over");
        clearLeaderAlignmentGuides();
        $$(".person-row.person-drag-over, .department.drag-over, .department.dept-drag-over, .department.dept-child-over, .department.dept-dragging, .exec-card.drag-over, .exec-card.part-owner-over, .side-drag-over, .connector-drag-over").forEach(node => node.classList.remove("person-drag-over", "drag-over", "part-owner-over", "dept-drag-over", "dept-child-over", "dept-dragging", "side-drag-over", "connector-drag-over"));
        draggedPersonId = null; draggedDepartmentId = null; draggedType = null;
      });
      const departmentDropMode = (department, event) => {
        const rect = department.getBoundingClientRect();
        if ((event.clientY - rect.top) / Math.max(rect.height, 1) > .62) return "child";
        return event.clientX < rect.left + rect.width / 2 ? "before" : "after";
      };
      const autoPanDuringDrag = event => {
        const rect = canvasWrap.getBoundingClientRect(); const edge = 92; const speed = 16;
        let moveX = 0; let moveY = 0;
        if (event.clientX < rect.left + edge) moveX = speed;
        else if (event.clientX > rect.right - edge) moveX = -speed;
        if (event.clientY < rect.top + edge) moveY = speed;
        else if (event.clientY > rect.bottom - edge) moveY = -speed;
        if (moveX || moveY) { viewport.x += moveX; viewport.y += moveY; applyViewport(); }
      };
      const isNearSideAnchor = (slot, event, side) => {
        const rect = slot.getBoundingClientRect(); const threshold = Math.max(54, 150 * viewport.scale);
        return side === "left" ? event.clientX >= rect.right - threshold : event.clientX <= rect.left + threshold;
      };
      $("#orgChartApp").addEventListener("dragover", event => {
        if (!draggedType) return;
        autoPanDuringDrag(event);
        if (draggedType === "department") {
          const ownerTarget = event.target.closest("[data-executive-id]");
          if (ownerTarget) { event.preventDefault(); ownerTarget.classList.add("part-owner-over"); return; }
        }
        if (draggedType === "leader") {
          clearLeaderAlignmentGuides();
          const sideSlot = event.target.closest("[data-leader-side-target]");
          if (sideSlot && sideSlot.dataset.leaderSideTarget !== draggedPersonId && isNearSideAnchor(sideSlot, event, sideSlot.dataset.leaderSide)) { event.preventDefault(); sideSlot.classList.add("side-drag-over"); return; }
          const connectorSide = event.target.closest("[data-connector-target]");
          if (connectorSide && connectorSide.dataset.connectorTarget !== draggedPersonId && isNearSideAnchor(connectorSide, event, connectorSide.dataset.connectorSide)) { event.preventDefault(); connectorSide.classList.add("side-drag-over"); return; }
          const connectorCenter = event.target.closest("[data-connector-center]");
          if (connectorCenter && connectorCenter.dataset.connectorCenter !== draggedPersonId) { event.preventDefault(); connectorCenter.classList.add("connector-drag-over"); return; }
          const executive = event.target.closest("[data-executive-id]");
          if (executive && executive.dataset.executiveId !== draggedPersonId) { event.preventDefault(); executive.classList.add("drag-over"); return; }
          const freeCanvas = event.target.closest("#orgCanvas, .canvas-wrap");
          if (freeCanvas && !event.target.closest(".department")) { event.preventDefault(); $("#orgCanvas").classList.add("free-leader-over"); leaderDragSnap = leaderAlignmentAt(event, draggedPersonId); updateLeaderAlignmentGuides(leaderDragSnap); }
          return;
        }
        if (draggedType === "person") {
          const row = event.target.closest(".person-row");
          if (row && row.dataset.rowId !== draggedPersonId) { event.preventDefault(); row.classList.add("person-drag-over"); return; }
        }
        const department = event.target.closest(".department");
        if (!department || (draggedType === "department" && department.dataset.departmentId === draggedDepartmentId)) return;
        event.preventDefault();
        if (draggedType === "department") {
          const mode = departmentDropMode(department, event);
          department.classList.toggle("dept-child-over", mode === "child"); department.classList.toggle("dept-drag-over", mode !== "child");
          const hint = department.querySelector(":scope > .drop-hint"); if (hint) hint.textContent = mode === "child" ? "하위 파트로 연결" : (mode === "before" ? "이 파트 왼쪽에 배치" : "이 파트 오른쪽에 배치");
        } else department.classList.add("drag-over");
      });
      $("#orgChartApp").addEventListener("dragleave", event => {
        const row = event.target.closest(".person-row");
        if (row && !row.contains(event.relatedTarget)) row.classList.remove("person-drag-over");
        const department = event.target.closest(".department");
        if (department && !department.contains(event.relatedTarget)) department.classList.remove("drag-over", "dept-drag-over", "dept-child-over");
        const executive = event.target.closest("[data-executive-id]");
        if (executive && !executive.contains(event.relatedTarget)) executive.classList.remove("drag-over", "part-owner-over");
        const sideSlot = event.target.closest("[data-leader-side-target], [data-connector-target]");
        if (sideSlot && !sideSlot.contains(event.relatedTarget)) sideSlot.classList.remove("side-drag-over");
        const connectorCenter = event.target.closest("[data-connector-center]");
        if (connectorCenter && !connectorCenter.contains(event.relatedTarget)) connectorCenter.classList.remove("connector-drag-over");
        if (!$("#orgCanvas").contains(event.relatedTarget)) $("#orgCanvas").classList.remove("free-leader-over");
      });
      $("#orgChartApp").addEventListener("drop", event => {
        if (!draggedType) return;
        if (draggedType === "department") {
          const ownerTarget = event.target.closest("[data-executive-id]");
          if (ownerTarget) { event.preventDefault(); ownerTarget.classList.remove("part-owner-over"); assignDepartmentToLeader(draggedDepartmentId, ownerTarget.dataset.executiveId); return; }
        }
        if (draggedType === "leader") {
          const sideSlot = event.target.closest("[data-leader-side-target]");
          if (sideSlot && isNearSideAnchor(sideSlot, event, sideSlot.dataset.leaderSide)) { event.preventDefault(); placeLeaderSide(draggedPersonId, sideSlot.dataset.leaderSideTarget, sideSlot.dataset.leaderSide); return; }
          const connectorSide = event.target.closest("[data-connector-target]");
          if (connectorSide && isNearSideAnchor(connectorSide, event, connectorSide.dataset.connectorSide)) { event.preventDefault(); placeLeaderSide(draggedPersonId, connectorSide.dataset.connectorTarget, connectorSide.dataset.connectorSide, true); return; }
          const connectorCenter = event.target.closest("[data-connector-center]");
          if (connectorCenter) { event.preventDefault(); insertLeaderBefore(draggedPersonId, connectorCenter.dataset.connectorCenter); return; }
          const executive = event.target.closest("[data-executive-id]");
          if (executive && executive.dataset.executiveId !== draggedPersonId) { event.preventDefault(); executive.classList.remove("drag-over"); reorderLeader(draggedPersonId, executive.dataset.executiveId); return; }
          const freeCanvas = event.target.closest("#orgCanvas, .canvas-wrap");
          if (freeCanvas && !event.target.closest(".department")) { event.preventDefault(); $("#orgCanvas").classList.remove("free-leader-over"); placeLeaderFree(draggedPersonId, event); }
          return;
        }
        if (draggedType === "person") {
          const row = event.target.closest(".person-row");
          if (row && row.dataset.rowId !== draggedPersonId) { event.preventDefault(); row.classList.remove("person-drag-over"); reorderPerson(draggedPersonId, row.dataset.departmentId, row.dataset.rowId); return; }
        }
        const department = event.target.closest(".department"); if (!department) return;
        event.preventDefault();
        const dropMode = departmentDropMode(department, event);
        department.classList.remove("drag-over", "dept-drag-over", "dept-child-over");
        if (draggedType === "department") dropMode === "child" ? nestDepartment(draggedDepartmentId, department.dataset.departmentId) : reorderDepartment(draggedDepartmentId, department.dataset.departmentId, dropMode);
        else movePerson(draggedPersonId, department.dataset.departmentId);
      });

      recordMonthEnd(); saveData(false); render(); renderInspector(); renderMonthlyPanel(); requestAnimationFrame(fitView);
      window.setInterval(() => {
        const before = data.monthlyHeadcount[monthKey(new Date())]; recordMonthEnd();
        if (data.monthlyHeadcount[monthKey(new Date())] !== before) { saveData(false); if (!$("#monthlyPanel").hidden) renderMonthlyPanel(); }
      }, 60 * 60 * 1000);
    })();
  </script>
</body>
</html>
